name: Build Multiplataforma, GitHub Pages, Packages & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

jobs:
  build-web:
    name: 🌐 Build Web & Deploy GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx vite build --base=./ --outDir dist-web
      - uses: actions/upload-artifact@v4
        with:
          name: nexomd-web-browser-bundle
          path: dist-web/

  publish-ghcr-package:
    name: 📦 Publicar Pacote Container (GitHub Packages GHCR)
    runs-on: ubuntu-latest
    needs: build-web
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nexomd-web-browser-bundle
          path: dist-web
      - name: Criar Dockerfile leve Nginx para o NexoMD Web
        run: |
          cat << 'EOF' > Dockerfile
          FROM nginx:alpine
          LABEL org.opencontainers.image.source="https://github.com/ed1rac/nexo-md"
          LABEL org.opencontainers.image.description="NexoMD — Editor Markdown Híbrido de Alta Performance por Edkallenn (@ed1rac)"
          LABEL org.opencontainers.image.licenses="GPL-3.0-or-later"
          COPY dist-web/ /usr/share/nginx/html/
          EXPOSE 80
          EOF
      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e Push para GitHub Packages (ghcr.io/ed1rac/nexo-md)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ed1rac/nexo-md:latest
            ghcr.io/ed1rac/nexo-md:0.1.0

  build-desktop:
    name: 🖥️ Build Nativo (${{ matrix.os }} - ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: nexomd-windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: nexomd-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: nexomd-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: nexomd-macos-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências WebKitGTK no Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Instalar dependências NPM e compilar Frontend
        run: |
          npm ci
          npm run build

      - name: Executar testes unitários do motor Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Compilar Binário Nativo Rust Release
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Publicar Binário Nativo da Plataforma
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/nexo-md
            src-tauri/target/${{ matrix.target }}/release/nexo-md.exe

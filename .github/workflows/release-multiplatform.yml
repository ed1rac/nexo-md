name: Build Multiplataforma (Windows, Linux, macOS & Web)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-web:
    name: 🌐 Build Web (Navegador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: nexomd-web-browser-bundle
          path: dist-web/

  build-desktop:
    name: 🖥️ Build Nativo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: nexomd-windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: nexomd-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: nexomd-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: nexomd-macos-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências WebKitGTK no Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Instalar dependências NPM e compilar Frontend
        run: |
          npm ci
          npm run build

      - name: Executar testes unitários do motor Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Compilar Binário Nativo Rust Release
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Publicar Binário Nativo da Plataforma
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/nexo-md
            src-tauri/target/${{ matrix.target }}/release/nexo-md.exe

[package]
name = "nexomd"
version = "0.1.0"
description = "NexoMD — High-performance Hybrid Native Markdown Editor Core in Rust"
authors = ["Edkallenn (@ed1rac) <edkevan@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/ed1rac/nexomd"
edition = "2021"

[lib]
name = "nexomd_lib"
crate-type = ["rlib"]

[[bin]]
name = "nexo-md"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = ["protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
ropey = "1.6.1"
pulldown-cmark = { version = "0.12.2", features = ["simd"] }
chardetng = "0.1.17"
encoding_rs = "0.8.35"
ignore = "0.4.23"
grep-regex = "0.1.13"
grep-searcher = "0.1.14"
grep-matcher = "0.1.7"
sha2 = "0.10.8"
uuid = { version = "1.11.0", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
